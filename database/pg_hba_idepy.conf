# Bloque agregado al pg_hba.conf de Postgres.app
#   ~/Library/Application Support/Postgres/var-17/pg_hba.conf
# Debe ir ANTES de las reglas "trust" (PostgreSQL aplica la primera regla que coincide).
# Después de editarlo:  psql -h localhost -p 5433 -U lucas10 -d postgres -c "select pg_reload_conf();"
#
# Por qué: Postgres.app trae todas las conexiones locales en "trust" (no pide contraseña).
# Con este bloque el usuario de la API (idepy_app) se autentica de verdad con contraseña
# (scram-sha-256) y no puede conectarse a ninguna otra base. El resto de los usuarios
# sigue igual.

# --- idepy_demo: el usuario de la API se autentica con contraseña (scram-sha-256) ---
# Debe ir ANTES de las reglas "trust": PostgreSQL usa la primera regla que coincide.
local   idepy_demo      idepy_app                               scram-sha-256
host    idepy_demo      idepy_app       127.0.0.1/32            scram-sha-256
host    idepy_demo      idepy_app       ::1/128                 scram-sha-256
# idepy_app no puede conectarse a ninguna otra base
local   all             idepy_app                               reject
host    all             idepy_app       127.0.0.1/32            reject
host    all             idepy_app       ::1/128                 reject
# --- fin idepy_demo ---
